# Bootstrap HTTP configuration only. Certbot installs HTTPS in the server copy.
# Do not overwrite a working HTTPS configuration with this template.
server {
    listen 80;
    server_name dev.easybook.bpms.co.kr 52.79.77.85;
    client_max_body_size 20M;
    location /static/ {
        alias /srv/easybook-dev/app/staticfiles/;
    }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
