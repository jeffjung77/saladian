{% extends 'ledger/base.html' %}{% block content %}
<section class="panel auth-panel"><div class="auth-heading"><span class="tag">BPMS 쉬운장부</span><h1>로그인</h1><p class="muted">등록한 계정으로 로그인하여 장부를 관리하세요.</p></div>
{% if next %}<p class="notice">장부를 이용하려면 먼저 로그인하세요.</p>{% endif %}
<form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="auth-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<input type="hidden" name="next" value="{{ next }}"><button class="auth-submit" type="submit">로그인</button></form>
<p class="auth-bottom">처음 이용하시나요? <a href="{% url 'signup' %}">회원가입</a></p></section>
{% endblock %}
