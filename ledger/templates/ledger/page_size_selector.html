<form method="get" style="display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:12px">
{% for key, value in request.GET.items %}{% if key != 'page' and key != 'per_page' %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endif %}{% endfor %}
<label for="list-page-size" style="margin:0">페이지당 표시</label>
<select id="list-page-size" name="per_page" onchange="this.form.submit()" style="width:auto"><option value="5" {% if page.paginator.per_page == 5 %}selected{% endif %}>5개씩</option><option value="10" {% if page.paginator.per_page == 10 %}selected{% endif %}>10개씩</option></select>
</form>
