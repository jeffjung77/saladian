<section class="panel report-controls"><form method="get" class="filter">{% for field in form %}<div><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button type="submit">조회</button>{% include 'ledger/report_actions.html' %}</form>{{ form.non_field_errors }}</section>
<style>@media print{header,.report-controls,.footer,.report-warning a{display:none}body{background:white;color:black;font-size:11px}main{max-width:none;margin:0;padding:0}.panel,.card{border-radius:0;padding:12px}.cards{grid-template-columns:repeat(3,1fr)}.table-wrap{overflow:visible}table{white-space:normal}tr{break-inside:avoid}h1{font-size:24px}}</style>
