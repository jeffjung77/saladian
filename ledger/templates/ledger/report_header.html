<div class="panel filter report-controls"><a class="btn {% if request.resolver_match.url_name != 'balance_sheet' %}secondary{% endif %}" href="{% url 'balance_sheet' %}">대차대조표</a><a class="btn {% if request.resolver_match.url_name != 'income_statement' %}secondary{% endif %}" href="{% url 'income_statement' %}">손익계산서</a><a href="{% url 'account_ledger' %}" class="btn secondary">계정별원장</a><button type="button" class="secondary" onclick="window.print()">인쇄</button></div>
<section class="panel report-controls"><form method="get" class="filter">{% for field in form %}<div><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button>조회</button></form>{{ form.non_field_errors }}</section>
<style>@media print{header,.report-controls,.footer,.report-warning a{display:none}body{background:white;color:black;font-size:11px}main{max-width:none;margin:0;padding:0}.panel,.card{border-radius:0;padding:12px}.cards{grid-template-columns:repeat(3,1fr)}.table-wrap{overflow:visible}table{white-space:normal}tr{break-inside:avoid}h1{font-size:24px}}</style>
