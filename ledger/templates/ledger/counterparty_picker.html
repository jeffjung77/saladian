<style>.counterparty-refresh-group{display:inline-flex;align-items:center;gap:8px;flex-wrap:nowrap}.counterparty-refresh-group>button{white-space:nowrap}.counterparty-refresh-group>.counterparty-info{flex-shrink:0}.counterparty-info{align-self:center;display:inline-block;font-size:12px;line-height:1;cursor:help}.counterparty-info:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:50%}#counterparty-status:empty{display:none}.counterparty-actions-inline{flex-wrap:nowrap;align-items:center;gap:8px}.counterparty-actions-inline>.btn,.counterparty-actions-inline .counterparty-refresh-group>button{padding:9px 10px;font-size:13px;white-space:nowrap}.counterparty-actions-inline>.btn{flex-shrink:0}.counterparty-actions-inline .counterparty-refresh-group{gap:6px}</style>
<div class="filter{% if compact_actions %} counterparty-actions-inline{% endif %}" style="margin-top:8px">{% if user.is_staff or user.is_superuser %}<a class="btn secondary" href="{% url 'counterparty_new' %}" target="_blank" rel="noopener">+ 거래처 등록 (새 창)</a>{% endif %}<span class="counterparty-refresh-group"><button type="button" class="secondary" id="refresh-counterparties" data-url="{% url 'counterparty_options' %}">목록 새로고침</button><span class="counterparty-info" tabindex="0" role="img" aria-label="새 거래처를 저장한 뒤 목록 새로고침을 누르면 작성 중인 내용을 유지하면서 선택할 수 있습니다." title="새 거래처를 저장한 뒤 목록 새로고침을 누르면 작성 중인 내용을 유지하면서 선택할 수 있습니다.">ⓘ</span></span></div><small class="help-text" id="counterparty-status" role="status"></small>
<script>
(() => {
  const button = document.getElementById('refresh-counterparties');
  const select = document.getElementById('id_counterparty');
  const status = document.getElementById('counterparty-status');
  button.addEventListener('click', async () => {
    button.disabled = true;
    try {
      const response = await fetch(button.dataset.url, {credentials: 'same-origin', cache: 'no-store', headers: {'Accept': 'application/json'}});
      if (!response.ok || response.redirected) throw new Error('request failed');
      const data = await response.json();
      const selected = select.value;
      const options = [new Option('거래처 미지정', '')];
      for (const partner of data.counterparties) options.push(new Option(partner.name, String(partner.id)));
      select.replaceChildren(...options);
      if (options.some(option => option.value === selected)) select.value = selected;
      status.textContent = '거래처 목록을 갱신했습니다. 사용할 거래처를 선택하세요.';
    } catch (error) {
      status.textContent = '목록을 불러오지 못했습니다. 로그인 상태와 연결을 확인한 뒤 다시 눌러주세요.';
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
