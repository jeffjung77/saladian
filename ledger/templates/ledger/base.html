<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가게장부 · 전표 관리</title>
<style>
:root{--ink:#18312e;--green:#146b55;--line:#e0e7e3;--muted:#64756d}*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:var(--ink);font:15px/1.6 system-ui,-apple-system,'Malgun Gothic',sans-serif}header{background:white;border-bottom:1px solid var(--line)}nav{max-width:1180px;margin:auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:800;color:var(--green);text-decoration:none}.tag{font-size:12px;background:#edf4ef;padding:4px 9px;border-radius:5px;margin-left:10px}main{max-width:1180px;margin:36px auto;padding:0 24px}h1{font-size:30px;letter-spacing:-1px;margin:0}h2{font-size:18px;margin:0 0 18px}.muted{color:var(--muted)}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.heading p{margin:5px 0}.btn,button{display:inline-block;border:0;border-radius:8px;padding:11px 18px;background:var(--green);color:white;text-decoration:none;font:inherit;cursor:pointer}.secondary{background:#eaf0ec;color:var(--ink)}.danger{background:#a33636}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:22px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:24px}.card strong{display:block;font-size:29px;margin-top:10px;letter-spacing:-1px}.income{color:#146b55}.expense{color:#bd5740}.panel{margin-bottom:22px}.filter{display:flex;align-items:end;gap:14px;flex-wrap:wrap}label{display:block;font-weight:600;margin-bottom:7px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd6ce;border-radius:7px;font:inherit;background:#fff;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:2px solid #8dc4ac;outline-offset:1px}.filter input{max-width:190px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:14px}th{text-align:left;color:var(--muted);font-weight:500;background:#f7f9f6}td,th{padding:14px 12px;border-bottom:1px solid var(--line)}.num{text-align:right;font-variant-numeric:tabular-nums}.badge{font-size:12px;padding:4px 9px;background:#eaf5ee;border-radius:5px}.badge.expense{background:#fcf0eb}.actions a{color:var(--green);margin-right:10px}.empty{text-align:center;padding:42px;color:var(--muted)}.notice{background:#e4f2e8;border-radius:8px;padding:12px 18px;margin-bottom:20px}.errorlist{color:#ae3030;list-style:none;padding:0;font-size:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.wide{grid-column:1/-1}.form-panel{max-width:760px}.footer{font-size:12px;color:var(--muted);margin:28px 0}.memo{white-space:normal;min-width:140px;overflow-wrap:anywhere}@media(max-width:700px){main{margin:24px auto;padding:0 14px}.cards{grid-template-columns:1fr;gap:10px}.card{padding:16px}.card strong{font-size:25px}.form-grid{grid-template-columns:1fr}.heading{align-items:flex-start}h1{font-size:25px}.panel{padding:16px}.tag{display:none}}
</style></head><body><header><nav><a class="brand" href="{% url 'dashboard' %}">가게장부<span class="tag">소상공인 회계 MVP</span></a><a href="{% url 'dashboard' %}" class="btn secondary">전표 · 집계</a></nav></header><main>{% for message in messages %}<div class="notice" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}<p class="footer">원화 기준 수입·지출 장부 · 차액은 입력한 수입에서 지출을 뺀 금액입니다. 복식부기·부가세 신고 기능은 포함하지 않습니다.</p></main></body></html>
