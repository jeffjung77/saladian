<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BPMS 쉬운장부 · 서비스 점검</title><style>body{font:16px/1.7 system-ui,'Malgun Gothic',sans-serif;background:#f5f7f4;color:#18312e;padding:24px}main{max-width:600px;margin:10vh auto;padding:28px;background:#fff;border:1px solid #e0e7e3;border-radius:12px}a{color:#146b55}</style></head><body><main><h1>BPMS 쉬운장부 서비스 점검</h1>{% if deployment.blocked %}<p>예약 배포를 위해 로그아웃되었습니다. 점검 중에는 로그인과 자료 입력이 제한됩니다.</p><p>배포 예정: {{ deployment.label }}</p><p>{{ deployment.message }}</p><p id="maintenance-status">배포 및 서비스 확인이 끝나면 다시 로그인할 수 있습니다.</p>{% else %}<p>서비스를 이용할 수 있습니다.</p>{% endif %}<a href="{% url 'login' %}">로그인 화면으로</a><p>문의: INFO@BPMS.CO.KR</p></main><script>setInterval(async()=>{try{const r=await fetch('/deployment/status/',{cache:'no-store'});if(r.ok){const s=await r.json();if(!s.blocked)location.replace('{% url "login" %}');}}catch(_){}},10000);</script></body></html>
