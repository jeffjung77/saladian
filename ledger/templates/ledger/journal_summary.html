{% load humanize %}
<section class="panel"><h2>기타전표 · 차변/대변 계정별 집계</h2><p class="muted">조회 기간의 복식전표만 집계합니다. 차변·대변 금액은 수입·지출 합계에 합산하지 않습니다.</p><div class="table-wrap"><table><thead><tr><th>계정코드</th><th>계정과목</th><th class="num">차변 합계(원)</th><th class="num">대변 합계(원)</th></tr></thead><tbody>{% for g in journal_groups %}<tr><td>{{ g.account_id }}</td><td>{{ g.account__name }}</td><td class="num">{{ g.debit|default:0|intcomma }}</td><td class="num">{{ g.credit|default:0|intcomma }}</td></tr>{% empty %}<tr><td colspan="4" class="empty">조회된 차변·대변 전표가 없습니다.</td></tr>{% endfor %}</tbody></table></div></section>
